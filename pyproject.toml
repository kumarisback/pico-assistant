# Project metadata and tool configuration.
#
# Runtime dependencies stay pinned in requirements.txt rather than here: the
# install is reproducible on a constrained machine where a resolver picking a
# different onnxruntime build is a real failure mode. This file carries metadata
# and tool config only, plus a light "test" extra used by CI.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-assistant"
version = "0.1.0"
description = "Local-first voice assistant server — no API keys, runs on a 4 GB GPU"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Arun Kumar", email = "arun987604@gmail.com" }]
keywords = ["voice-assistant", "whisper", "llama-cpp", "piper-tts", "esp32", "offline"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Repository = "https://github.com/kumarisback/pico-assistant"

[project.scripts]
pico-server = "server.main:run"

[tool.setuptools]
packages = ["server", "server.tools", "clients"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
# CI installs requirements-test.txt directly, so the extra must read the same
# file — listing the packages here as well is how the two drifted apart before.
optional-dependencies.test = { file = ["requirements-test.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
    "ANN401",  # Any is correct for the tool-argument boundary
    "B008",    # FastAPI dependency injection idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]       # fixtures and assertions read better untyped
"clients/*" = ["ANN"]     # thin scripts
